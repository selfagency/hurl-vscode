name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (compile + integration)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: CI=true pnpm i

      - name: Install Xvfb and GUI dependencies (for VS Code test-electron)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libxss1 libasound2 libnss3 libx11-xcb1 libxcomposite1 libxrandr2 libxdamage1 libxfixes3 libatk1.0-0 libx11-6 libxkbcommon0 libgbm1

      - name: Run tests (headless Xvfb)
        env:
          CI: true
        run: xvfb-run --auto-servernum --server-args='-screen 0 1024x768x24' pnpm test
